[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-matcher"
version = "0.1.0"
description = "Personal job evaluation with TypeSafe Jev, JSON CLI, SQLite, and MCP"
requires-python = ">=3.12"
dependencies = ["typesafe-sdk>=0.7.2,<0.8", "mcp>=2.2,<3", "pydantic>=2.13,<3", "python-dotenv>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[project.scripts]
job-matcher = "job_matcher.cli:main"
job-matcher-mcp = "job_matcher.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
